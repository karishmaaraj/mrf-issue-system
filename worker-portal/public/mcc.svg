<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" fill="none">
  <!-- MCC Crest - Ultra Crisp Vector Version -->
  <g stroke="#800000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- TOP BLESSING HAND -->
    <!-- Wrist Base -->
    <path d="M175 125 C175 100 180 75 190 68" />
    <path d="M225 125 C225 100 220 75 210 68" />
    
    <!-- Index Finger (Raised) -->
    <path d="M190 68 L190 22 C190 14 198 14 198 22 L198 62" stroke-width="6.5" fill="#800000" fill-opacity="0.05" />
    
    <!-- Middle Finger (Raised) -->
    <path d="M198 62 L198 18 C198 10 206 10 206 18 L206 65" stroke-width="6.5" fill="#800000" fill-opacity="0.05" />
    
    <!-- Folded Ring & Pinky Fingers -->
    <path d="M206 65 C210 54 222 54 222 70 C222 84 208 88 202 92" stroke-width="5.5" />
    <path d="M222 70 C230 64 238 70 234 80 C230 90 214 98 208 100" stroke-width="5.5" />
    
    <!-- Thumb -->
    <path d="M190 68 C180 74 180 84 188 90 C194 94 200 92 200 88" stroke-width="5.5" />

    <!-- TORSE / WREATH BAR UNDER HAND -->
    <rect x="135" y="125" width="130" height="18" rx="9" fill="#ffffff" stroke-width="6" />
    <path d="M156 125 L148 143" stroke-width="4.5" />
    <path d="M182 125 L174 143" stroke-width="4.5" />
    <path d="M208 125 L200 143" stroke-width="4.5" />
    <path d="M234 125 L226 143" stroke-width="4.5" />

    <!-- MAIN SHIELD -->
    <path d="M60 148 H340 L315 360 C315 415 200 455 200 455 C200 455 85 415 85 360 Z" fill="#ffffff" stroke-width="8" />

    <!-- HORIZONTAL HATCH LINES (Lower Shield) -->
    <path d="M83 280 H317" stroke-width="4" opacity="0.95" />
    <path d="M84 296 H316" stroke-width="4" opacity="0.95" />
    <path d="M86 312 H314" stroke-width="4" opacity="0.95" />
    <path d="M88 328 H312" stroke-width="4" opacity="0.95" />
    <path d="M91 344 H309" stroke-width="4" opacity="0.95" />
    <path d="M95 360 H305" stroke-width="4" opacity="0.95" />
    <path d="M102 376 H298" stroke-width="4" opacity="0.95" opacity="0.95" />
    <path d="M112 392 H288" stroke-width="4" opacity="0.95" />
    <path d="M128 408 H272" stroke-width="4" opacity="0.95" />
    <path d="M148 424 H252" stroke-width="4" opacity="0.95" />

    <!-- ANCHOR -->
    <!-- Top Ring -->
    <circle cx="200" cy="184" r="18" fill="#ffffff" stroke-width="6.5" />
    <circle cx="200" cy="184" r="7" fill="#800000" stroke-width="0" />

    <!-- Crossbar / Stock -->
    <path d="M130 245 H270" stroke-width="9" />
    <path d="M130 236 V254 M270 236 V254" stroke-width="6" />

    <!-- Main Vertical Shank -->
    <path d="M200 202 V410" stroke-width="11" />

    <!-- Anchor Curved Arms / Flukes -->
    <path d="M95 330 C95 410 200 435 200 435 C200 435 305 410 305 330" stroke-width="9" />
    <!-- Fluke Arrow Left -->
    <path d="M95 330 L112 375 L75 355 Z" fill="#800000" stroke-width="2" />
    <!-- Fluke Arrow Right -->
    <path d="M305 330 L288 375 L325 355 Z" fill="#800000" stroke-width="2" />

    <!-- Coiled Rope -->
    <path d="M210 184 C250 184 250 225 205 235 C160 245 160 290 205 300 C250 310 250 355 190 385" stroke-width="5.5" stroke-dasharray="9 4" />

    <!-- SCROLL BANNER AT BOTTOM -->
    <!-- Left Ribbon Fold -->
    <path d="M25 365 C25 382 58 405 98 412 L98 472 C58 465 25 440 25 420 Z" fill="#ffffff" stroke-width="5" />
    <!-- Right Ribbon Fold -->
    <path d="M375 365 C375 382 342 405 302 412 L302 472 C342 465 375 440 375 420 Z" fill="#ffffff" stroke-width="5" />

    <!-- Center Main Banner Scroll -->
    <path d="M65 410 Q200 480 335 410 L335 468 Q200 538 65 468 Z" fill="#ffffff" stroke-width="6.5" />

    <!-- Ribbon End Ribs -->
    <path d="M65 410 L45 390 V445 L65 468" stroke-width="4.5" />
    <path d="M335 410 L355 390 V445 L335 468" stroke-width="4.5" />
  </g>

  <!-- BANNER TEXT: IN HOC SIGNO -->
  <text x="125" y="460" font-family="'Times New Roman', Georgia, serif" font-size="28" font-weight="900" fill="#800000" text-anchor="middle" transform="rotate(-7 125 460)" letter-spacing="2">IN HOC</text>
  <text x="275" y="460" font-family="'Times New Roman', Georgia, serif" font-size="28" font-weight="900" fill="#800000" text-anchor="middle" transform="rotate(7 275 460)" letter-spacing="2">SIGNO</text>
</svg>
